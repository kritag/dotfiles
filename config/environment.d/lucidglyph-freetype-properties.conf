# Same filename as lucidglyph's, so this masks the /etc/environment.d/ version.
# Stem darkening on, with a custom curve tuned by eye for a 109 PPI scale-1
# ultrawide and a 222 PPI scale-1.5 laptop (lucidglyph's own curve was too
# strong on the ultrawide; the FreeType default was too weak on the laptop).
FREETYPE_PROPERTIES="autofitter:no-stem-darkening=0 autofitter:darkening-parameters=750,400,1500,350,2500,300,3500,0 cff:no-stem-darkening=0 type1:no-stem-darkening=0 t1cid:no-stem-darkening=0"
