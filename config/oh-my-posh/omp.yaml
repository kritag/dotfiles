# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
var:
  PromptChar: ❯
  PromptCharCmd: ❮
secondary_prompt:
  template: '❯❯ '
  foreground: magenta
  background: transparent
transient_prompt:
  template: '❯ '
  background: transparent
  foreground_templates:
    - '{{if gt .Code 0}}red{{end}}'
    - '{{if eq .Code 0}}green{{end}}'
blocks:
  - type: prompt
    alignment: left
    segments:
      - type: session
        template: '{{ if .SSHSession }} {{ .UserName }} {{ end }}'
        foreground: magenta
        background: transparent
        style: plain
      - type: path
        template: '<b>{{ .Path }}</b> '
        foreground: blue
        background: transparent
        style: plain
        options:
          style: full
      - type: git
        template: "{{ url .UpstreamIcon .UpstreamURL }} {{ .HEAD }}{{ if .UpstreamGone }}  {{ end }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }}"
        foreground: black
        leading_diamond: 
        trailing_diamond: 
        background: green
        style: diamond
        options:
          branch_icon: ' '
          ignore_submodules: {"*": "all"}
          native_status: true
        foreground_templates:
          - '{{ if or (.Working.Changed) (.Staging.Changed) }}black{{ end }}'
          - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}black{{ end }}'
          - '{{ if gt .Ahead 0 }}black{{ end }}'
        background_templates:
          - '{{ if or (.Working.Changed) (.Staging.Changed) }}yellow{{ end }}'
          - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}red{{ end }}'
          - '{{ if gt .Ahead 0 }}blue{{ end }}'
          - '{{ if gt .Behind 0 }}red{{ end }}'
  - type: prompt
    alignment: right
    segments:
      - type: kubectl
        leading_diamond: 
        template: '<b>{{ $cluster := regexReplaceAll "^api-(os-)?" .Cluster "" }}{{ regexReplaceAll "-[^-]+-[^-]+:.*" $cluster "" }}</b>'
        foreground: black
        background: cyan
        style: diamond
      - type: kubectl
        template: '{{ .Namespace }}'
        foreground: black
        background: magenta
        style: powerline
        powerline_symbol: 
  - type: prompt
    alignment: left
    segments:
      - type: vimode
        template: '{{ if eq .Mode "insert" }}{{ .Var.PromptChar }}{{ else }}{{ .Var.PromptCharCmd }}{{ end }}'
        background: transparent
        style: plain
        foreground_templates:
          - '{{if gt .Code 0}}red{{end}}'
          - '{{if eq .Code 0}}magenta{{end}}'
    newline: true
version: 4
async: true
final_space: true
