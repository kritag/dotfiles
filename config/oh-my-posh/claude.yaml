# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
version: 4
final_space: true
blocks:
  - type: prompt
    alignment: left
    segments:
      - type: claude
        style: diamond
        leading_diamond: 
        trailing_diamond: 
        foreground: '22'
        background: green
        background_templates:
          - '{{ if and .Vim (eq .Vim.Mode "INSERT") }}23{{ end }}'
          - '{{ if and .Vim (or (eq .Vim.Mode "VISUAL") (eq .Vim.Mode "VISUAL LINE")) }}red{{ end }}'
        template: '{{ if .Vim }}<b>{{ if eq .Vim.Mode "INSERT" }}I{{ else if eq .Vim.Mode "VISUAL" }}V{{ else if eq .Vim.Mode "VISUAL LINE" }}V-L{{ else }}N{{ end }}</b>{{ end }}'
      - type: claude
        style: plain
        foreground: blue
        background: transparent
        template: '<b>{{ base .Workspace.ProjectDir }}</b> '
      - type: git
        template: '{{ url .UpstreamIcon .UpstreamURL }} {{ .HEAD }}{{ if .UpstreamGone }} {{ end }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }}'
        foreground: black
        background: green
        style: diamond
        options:
          branch_icon: ' '
          ignore_submodules:
            '*': all
          native_status: true
        foreground_templates:
          - '{{ if or (.Working.Changed) (.Staging.Changed) }}black{{ end }}'
          - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}black{{ end }}'
          - '{{ if gt .Ahead 0 }}black{{ end }}'
        background_templates:
          - '{{ if or (.Working.Changed) (.Staging.Changed) }}yellow{{ end }}'
          - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}red{{ end }}'
          - '{{ if gt .Ahead 0 }}blue{{ end }}'
          - '{{ if gt .Behind 0 }}red{{ end }}'
        leading_diamond: 
        trailing_diamond: 
      - type: claude
        style: plain
        foreground: '208'
        background: transparent
        template: ' <b>{{ .Model.DisplayName }}</b>{{ if .Effort }} [{{ .Effort.Level }}]{{ end }} '
  - type: prompt
    alignment: right
    segments:
      - type: claude
        style: plain
        foreground: magenta
        background: transparent
        template: "{{ if and .Agent .Agent.Name }}\U000F06A9 <b>{{ .Agent.Name }}</b> {{ end }}"
      - type: claude
        style: diamond
        foreground: black
        background: green
        options:
          gauge_marked_char: ●
          gauge_unmarked_char: ○
        foreground_templates:
          - '{{ if gt .TokenUsagePercent 80.0 }}white{{ end }}'
        background_templates:
          - '{{ if gt .TokenUsagePercent 80.0 }}red{{ end }}'
          - '{{ if gt .TokenUsagePercent 40.0 }}yellow{{ end }}'
        template: '<b>{{ .TokenGaugeUsed }}</b> {{ regexReplaceAll "\\.[0-9]" (lower .FormattedTokens) "" }}/{{ if ge .ContextWindow.ContextWindowSize 1000000 }}{{ div .ContextWindow.ContextWindowSize 1000000 }}M{{ else }}{{ div .ContextWindow.ContextWindowSize 1000 }}k{{ end }} {{ .TokenUsagePercent }}%'
        leading_diamond: 
        trailing_diamond: 
      - type: claude
        style: diamond
        leading_diamond: ' '
        foreground: black
        background: cyan
        template: <b>{{ .FormattedCost }}</b>
      - type: claude
        style: powerline
        powerline_symbol: 
        foreground: black
        background: magenta
        template: ' {{ $m := div (int .Cost.TotalDurationMS) 60000 }}{{ if ge $m 60 }}{{ div $m 60 }}h {{ mod $m 60 }}m{{ else }}{{ $m }}m{{ end }} '
