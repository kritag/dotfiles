# Low-latency audio for guitar (Carla / Ratatouille / pipewire-jack).
# 256 frames at 48 kHz is about 5.3 ms per period: Windows plugins via yabridge crackle the whole
# graph at 64. A DAW can still ask for less down to min-quantum (64 = 1.3 ms).
context.properties = {
    default.clock.rate          = 48000
    # lets a DAW switch the graph to 96 kHz (amp sims alias less); desktop apps get resampled
    default.clock.allowed-rates = [ 48000 96000 ]
    default.clock.quantum       = 256
    default.clock.min-quantum   = 64
    default.clock.max-quantum   = 512
}
