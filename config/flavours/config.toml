# subtemplate = "colors"
# rewrite = true

[[items]]
file = "~/.config/cava/config"
template = "cava"
rewrite = true

[[items]]
file = "~/.config/glow/colors.json"
template = "glow"
rewrite = true

[[items]]
file = "~/.config/hypr/colors.lua"
template = "hypr"
rewrite = true

[[items]]
file = "~/.config/lazygit/colors.yml"
template = "lazygit"
rewrite = true

[[items]]
file = "~/.config/spicetify/Themes/flavours/color.ini"
template = "spicetify"
rewrite = true

[[items]]
file = "~/.config/flavours/slack"
template = "slack"
rewrite = true

[[items]]
file = "~/.theme.gitconfig"
template = "delta"
rewrite = true

[[items]]
file = "~/.config/DankMaterialShell/colors.json"
template = "dms"
rewrite = true

[[items]]
file = "~/.config/hyprland-preview-share-picker/colors.css"
template = "hyprland-preview-share-picker"
rewrite = true

# zsh-patina reads its theme once at daemon start, so it needs the hook to pick
# up a new scheme. This writes current.toml; the other themes in that directory
# are translated from bat .tmTheme files and are not touched by flavours.
[[items]]
file = "~/.config/zsh-patina/themes/current.toml"
template = "zsh-patina"
rewrite = true
hook = "zsh-patina restart || true"

