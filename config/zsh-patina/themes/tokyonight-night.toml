# zsh-patina theme: TokyoNight
# Generated from bat theme tokyonight-night.tmTheme
# Theme author: Folke Lemaitre (http://github.com/folke)
#
# Static scopes are resolved directly against the source theme's own
# Sublime scope selectors, so they match what bat renders. Italic is
# dropped (zsh-patina's ZLE backend supports bold/underline only).
#
# Derived dynamic colours:
#   callable.command/function <- variable.function (#7aa2f7)
#   callable.missing       <- invalid.illegal fg (#f7768e)
#   callable.builtin       <- support.function (#2ac3de)
#   callable.alias         <- constant.numeric (#ff9e64)
#   path.directory.*       <- nearest readable cyan in palette (#b4f9f8)
#   path.file.partial      <- comment (#565f89)
#   variable.parameter.option (flags) <- nearest readable yellow/orange in palette (#ffdb69)
#
# Regenerate with ~/.config/zsh-patina/generate-themes.py -- edits are lost.

# source
"source" = "#c0caf5"

# comment
"comment" = "#565f89"

# string
"string" = "#9ece6a"

# constant
"constant.character" = "#89ddff"
"constant.numeric" = "#ff9e64"

# invalid
"invalid" = "#f7768e"

# keyword
"keyword.builtin" = "#bb9af7"
"keyword.control.case" = "#bb9af7"
"keyword.control.do" = "#bb9af7"
"keyword.control.done" = "#bb9af7"
"keyword.control.end" = "#bb9af7"
"keyword.control.flow" = "#c0caf5"
"keyword.control.for" = "#bb9af7"
"keyword.control.foreach" = "#bb9af7"
"keyword.control.heredoc-token" = "#bb9af7"
"keyword.control.if" = "#bb9af7"
"keyword.control.in" = "#bb9af7"
"keyword.control.regexp" = "#bb9af7"
"keyword.control.repeat" = "#bb9af7"
"keyword.control.select" = "#bb9af7"
"keyword.control.until" = "#bb9af7"
"keyword.control.while" = "#bb9af7"
"keyword.operator.arithmetic" = "#89ddff"
"keyword.operator.assignment" = "#89ddff"
"keyword.operator.bitwise" = "#bb9af7"
"keyword.operator.end-of-options" = "#89ddff"
"keyword.operator.expansion" = "#89ddff"
"keyword.operator.herestring" = "#89ddff"
"keyword.operator.indirection" = "#89ddff"
"keyword.operator.logical" = "#bb9af7"
"keyword.operator.regexp" = "#89ddff"
"keyword.operator.substitution" = "#89ddff"
"keyword.operator.substring" = "#89ddff"
"keyword.operator.ternary" = "#bb9af7"
"keyword.operator.word" = "#89ddff"
"keyword.other" = "#89ddff"

# storage
"storage.modifier" = "#9d7cd8"
"storage.type" = "#bb9af7"

# entity
"entity" = "#7aa2f7"

# support
"support" = "#2ac3de"

# variable
"variable.function" = "#7aa2f7"
"variable.language" = "#f7768e"
"variable.other" = "#c0caf5"
"variable.parameter" = "#e0af68"
"variable.parameter.option" = "#ffdb69"

# punctuation
"punctuation.definition.comment" = "#565f89"
"punctuation.definition.compound" = "#89ddff"
"punctuation.definition.numeric" = "#89ddff"
"punctuation.definition.parameter" = "#ffdb69"
"punctuation.definition.string" = "#89ddff"
"punctuation.definition.variable" = "#89ddff"
"punctuation.section" = "#9abdf5"
"punctuation.separator" = "#89ddff"
"punctuation.terminator" = "#89ddff"

# meta
"meta.function" = "#c0caf5"
"meta.function-call" = "#7aa2f7"
"meta.group.arithmetic" = "#c0caf5"
"meta.group.expansion.arithmetic" = "#9ece6a"
"meta.group.expansion.brace" = "#c0caf5"
"meta.group.expansion.command" = "#c0caf5"
"meta.group.expansion.history" = "#c0caf5"
"meta.group.expansion.job" = "#c0caf5"
"meta.group.expansion.parameter" = "#9abdf5"
"meta.group.expansion.tilde" = "#f7768e"
"meta.group.for" = "#c0caf5"
"meta.group.foreach" = "#c0caf5"
"meta.group.parens" = "#c0caf5"
"meta.group.select" = "#c0caf5"
"meta.post-cmd" = "#c0caf5"
"meta.regexp" = "#c0caf5"

# precommand
"precommand" = "#c0caf5"

# dynamic scopes -- resolved at runtime, mixed into the styles above
# (fg/bg override; bold/underline are OR-ed in). Requires
# dynamic = { callables = true, paths = "partial" } in config.toml.
"dynamic.callable" = "#7aa2f7"
"dynamic.callable.command" = "#7aa2f7"
"dynamic.callable.builtin" = "#2ac3de"
"dynamic.callable.function" = { foreground = "#7aa2f7", bold = true }
"dynamic.callable.alias" = "#ff9e64"
"dynamic.callable.missing" = { foreground = "#f7768e", bold = true }
"dynamic.path.file.complete" = { underline = true }
"dynamic.path.file.partial" = "#565f89"
"dynamic.path.directory.complete" = { foreground = "#b4f9f8", underline = true }
"dynamic.path.directory.partial" = "#b4f9f8"
