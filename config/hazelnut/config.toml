[general]
log_level = "info"
debounce_seconds = 1
polling_interval_secs = 5
log_retention = 1000
start_daemon_on_launch = false
notifications_enabled = false
theme = "everforest"

[[watch]]
path = "~/downloads"
recursive = false
rules = []

[[rule]]
name = "documents"
enabled = true
stop_processing = false

[rule.condition]
extensions = [
    "docx",
    "doc",
    "xlsx",
    "pptx",
    "odt",
    "ods",
    "txt",
    "csv",
]

[rule.action]
type = "move"
destination = "~/documents/{ext}"
create_destination = true
overwrite = false

[[rule]]
name = "markdown-sort"
enabled = true
stop_processing = true

[rule.condition]
extensions = []
name_regex = '(?i)_\d{4}-\d{2}-\d{2}_\d{2}-\d{2}-\d{2}\.(md|markdown)$'

[rule.action]
type = "move"
destination = "~/documents/markdown"
create_destination = true
overwrite = false

[[rule]]
name = "json-sort"
enabled = true
stop_processing = true

[rule.condition]
extensions = []
name_regex = '(?i)_\d{4}-\d{2}-\d{2}_\d{2}-\d{2}-\d{2}\.json$'

[rule.action]
type = "move"
destination = "~/documents/json"
create_destination = true
overwrite = false

[[rule]]
name = "pdf-sort"
enabled = true
stop_processing = true

[rule.condition]
extensions = []
name_regex = '(?i)_\d{4}-\d{2}-\d{2}_\d{2}-\d{2}-\d{2}\.pdf$'

[rule.action]
type = "move"
destination = "~/documents/pdf"
create_destination = true
overwrite = false

[[rule]]
name = "shell-sort"
enabled = true
stop_processing = true

[rule.condition]
extensions = []
name_regex = '(?i)_\d{4}-\d{2}-\d{2}_\d{2}-\d{2}-\d{2}\.(sh|bash|zsh)$'

[rule.action]
type = "move"
destination = "~/documents/scripts"
create_destination = true
overwrite = false

[[rule]]
name = "guitar-sort"
enabled = true
stop_processing = true

[rule.condition]
extensions = []
name_regex = '(?i)_\d{4}-\d{2}-\d{2}_\d{2}-\d{2}-\d{2}\.(gp|gp3|gp4|gp5|gpx|ptb|tg|tbt)$'

[rule.action]
type = "move"
destination = "~/documents/guitar-tabs"
create_destination = true
overwrite = false

[[rule]]
name = "stamp"
enabled = true
stop_processing = false

[rule.condition]
extensions = [
    "md",
    "markdown",
    "json",
    "pdf",
    "sh",
    "bash",
    "zsh",
    "gp",
    "gp3",
    "gp4",
    "gp5",
    "gpx",
    "ptb",
    "tg",
    "tbt",
]

[rule.action]
type = "rename"
pattern = "{name}_{datetime}.{ext}"

[[rule]]
name = "3d-printing"
enabled = true
stop_processing = false

[rule.condition]
extensions = [
    "3mf",
    "stl",
    "step",
    "stp",
    "obj",
    "gcode",
]

[rule.action]
type = "move"
destination = "~/documents/3d-printing"
create_destination = true
overwrite = false

[[rule]]
name = "images"
enabled = true
stop_processing = false

[rule.condition]
extensions = [
    "png",
    "jpg",
    "jpeg",
    "webp",
    "gif",
    "svg",
