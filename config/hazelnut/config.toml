[rule.action]
type = "move"
destination = "~/downloads/archives"
create_destination = true
overwrite = false

[[rule]]
name = "isos"
enabled = true
stop_processing = false

[rule.condition]
extensions = ["iso"]

[rule.action]
type = "move"
destination = "~/downloads/isos"
create_destination = true
overwrite = false

[[rule]]
name = "installers"
enabled = true
