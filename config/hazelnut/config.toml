destination = "~/videos/downloads"
create_destination = true
overwrite = false

[[rule]]
name = "yaml-sort"
enabled = true
stop_processing = true

[rule.condition]
extensions = []
name_regex = '_\d{4}-\d{2}-\d{2}_\d{2}-\d{2}-\d{2}\.yaml$'

[rule.action]
type = "move"
destination = "~/documents/yaml"
create_destination = true
overwrite = false

[[rule]]
name = "yaml-stamp"
enabled = true
stop_processing = false

[rule.condition]
extensions = [
    "yaml",
    "yml",
]

[rule.action]
type = "rename"
pattern = "{name}_{datetime}.yaml"
