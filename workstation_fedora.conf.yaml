- plugins:
    - plugins/sudo.py
    - plugins/yum.py
- sudo:
    - defaults:
        yum:
          options: "-q -y"
          stdout: False
          stderr: True
    - shell:
        - ["grubby --info=ALL | grep -q 'selinux=0' || grubby --update-kernel ALL --args selinux=0", "Set kernel arg selinux=0"]
        - ["[ -f /etc/selinux/config ] && sed -i 's/^SELINUX=.*/SELINUX=disabled/' /etc/selinux/config", "Set SELINUX=disabled in /etc/selinux/config"]
        - ["[ -e /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:brycensranch:gpu-screen-recorder-git.repo ] || dnf copr enable brycensranch/gpu-screen-recorder-git -y", "Enable copr brycensranch/gpu-screen-recorder-git"]
        - ["[ -e /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:bonvaffel:cli-tools.repo ] || dnf copr enable bonvaffel/cli-tools -y", "Enable copr bonvaffel/cli-tools"]
        - ["[ -e /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:sdegler:hyprland.repo ] || dnf copr enable sdegler/hyprland -y", "Enable copr sdegler/hyprland"]
        - ["[ -e /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:sneexy:zen-browser.repo ] || dnf copr enable sneexy/zen-browser -y", "Enable copr sneexy/zen-browser"]
        - ["[ -e /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:avengemedia:dms.repo ] || dnf copr enable avengemedia/dms -y", "Enable copr avengemedia/dms"]
        - ["[ -e /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:avengemedia:danklinux.repo ] || dnf copr enable avengemedia/danklinux -y", "Enable copr avengemedia/danklinux"]
        - ["rpm -q rpmfusion-free-release || dnf install -y https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm", "Enable RPM Fusion free"]
        - ["rpm -q rpmfusion-nonfree-release || dnf install -y https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm", "Enable RPM Fusion nonfree"]
        - ["[ \"$(plymouth-set-default-theme)\" = spinner ] || plymouth-set-default-theme spinner -R", "Set plymouth theme (rebuilds initramfs only on change)"]
        - [systemctl mask keybase-redirector.service, "Mask keybase-redirector.service"]
        - [rm -f /etc/xdg/autostart/solaar.desktop]
