- plugins:
    - dotbot-sudo
- defaults:
    link:
      relink: true
      create: true
      backup: true
- clean:
    '~':
    '~/.config':
      recursive: true
- link:
    ~/.aliases.zsh: zsh/aliases.zsh
    ~/.config/fastfetch/config.jsonc: config/fastfetch/config.jsonc
    ~/.config/lazygit/config.yaml: config/lazygit/config.yaml
    ~/.config/tealdeer/config.toml: config/tealdeer/config.toml
    ~/.gitconfig: config/gitconfig
    ~/.lessfilter: config/lessfilter
    ~/.markdownlint.yaml: config/markdownlint.yaml
    ~/.ripgreprc: config/ripgreprc
    ~/.theme.gitconfig: config/delta/theme.gitconfig
    ~/.vimrc: config/vimrc
    ~/.yamlfmt.yaml: config/yamlfmt.yaml
    ~/.zshenv: zsh/zshenv
    ~/.zshkeybindings.zsh: zsh/zshkeybindings.zsh
    ~/.zshrc: zsh/zshrc
    ~/.zstyle.zsh: zsh/zstyle.zsh
    ~/.config/zsh-patina:
      path: config/zsh-patina/*
      glob: true
    ~/.config/oh-my-posh/:
      path: config/oh-my-posh/*
      glob: true
    ~/.config/eza:
      path: config/eza/*
      glob: true
    ~/.config/vivid:
      path: config/vivid/*
      glob: true
    ~/.config/bat:
      path: config/bat/*
      glob: true
    ~/.config/glow:
      path: config/glow/*
      glob: true
    ~/.config/lazyvim:
      path: config/lazyvim
- sudo:
    - shell:
        - [cp config/wifi-powersave-off.conf /etc/NetworkManager/conf.d, Disables WiFi powersaving]
        - [scripts/add_sudoers.sh, Adding USER to sudoers]
- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - [touch ~/.env, Creating the .env file if it does not exist]
