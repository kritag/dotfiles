- plugins:
    - plugins/sudo.py
    - plugins/yay.py
- shell:
    - command: scripts/bootstrap-yay.sh
      description: Install yay
      stdin: true
      stdout: true
      stderr: true
- sudo:
    - shell:
        - ["grep -q '^\\[multilib\\]' /etc/pacman.conf || { sed -i -e 's/^#\\s*LogFile/LogFile/' -e 's/^#\\s*Color/Color/' -e 's/^#\\s*ParallelDownloads/ParallelDownloads/' -e 's/^#\\s*ILoveCandy/ILoveCandy/' -e '/^#\\s*\\[multilib\\]/,/^#\\s*Include/s/^#\\s*//' /etc/pacman.conf && pacman -Syu --noconfirm; }", "Configure pacman defaults, enable multilib and sync"]
        - ["grep -q '^\\[proaudio\\]' /etc/pacman.conf || { curl -fsS https://arch.osamc.de/proaudio/osamc.gpg | pacman-key --add - && pacman-key --lsign-key 762AE5DB2B38786364BD81C4B9141BCC62D38EE5 && printf '\\n[proaudio]\\nServer = https://arch.osamc.de/$repo/$arch\\n' >> /etc/pacman.conf && pacman -Sy; }", "Add the proaudio repo (tuxguitar, ratatouille)"]
        - ["sed -i 's/^#\\?MAKEFLAGS=.*/MAKEFLAGS=\"-j16\"/' /etc/makepkg.conf", "Enable parallel makepkg builds"]
