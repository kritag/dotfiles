- plugins:
    - dotbot-sudo
    - dotbot-yum
- sudo:
    - defaults:
        yum:
          options: "-q -y"
          stdout: False
          stderr: True
    - shell:
        - [dnf copr enable bonvaffel/cli-tools -y]
        - [scripts/addusertodockergrp.sh]
        - [scripts/install-server-zsh.sh, "Install shared zsh setup for all users"]
    - yum:
        - bash-completion
        - bat
        - bat-extras
        - btop
        - cargo
        - dnf-automatic
        - dnf-plugins-core
        - docker-compose
        - duf
        - eza
        - fastfetch
        - fd-find
        - fzf
        - gh
        - git
        - git-delta
        - gitleaks
        - less
        - lesspipe
        - make
        - moby-engine
        - neovim
        - nodejs-npm
        - oh-my-posh
        - python3
        - python3-pip
        - rclone
        - restic
        - ripgrep
        - socat
        - sqlite
        - tealdeer
        - tinty
        - tree-sitter-cli
        - unzip
        - vim
        - vivid
        - wget
        - yp-tools
        - yq
        - zoxide
        - zsh
        - zsh-autosuggestions
        - zsh-patina
