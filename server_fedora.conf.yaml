- plugins:
    - plugins/sudo.py
    - plugins/dnf.py
- sudo:
    - defaults:
        dnf:
          options: "-y"
          stdout: False
          stderr: True
    - shell:
        - ["grep -q ^max_parallel_downloads /etc/dnf/dnf.conf || echo max_parallel_downloads=10 >> /etc/dnf/dnf.conf", "Allow 10 parallel dnf downloads"]
        - ["[ -e /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:bonvaffel:cli-tools.repo ] || dnf copr enable bonvaffel/cli-tools -y", "Enable copr bonvaffel/cli-tools"]
        - [scripts/addusertodockergrp.sh]
    - dnf:
        - bash-completion
        - bat
        - bat-extras
        - btop
        - cargo
        - dnf-automatic
        - dnf-plugins-core
        - docker-compose
        - duf
        - eza
        - fastfetch
        - fd-find
        - fzf
        - gh
        - git
        - git-delta
        - gitleaks
        - glow
        - lazygit
        - less
        - lesspipe
        - make
        - moby-engine
        - neovim
        - nodejs-npm
        - oh-my-posh
        - python3
        - python3-pip
        - rclone
        - restic
        - ripgrep
        - socat
        - sqlite
        - tealdeer
        - tinty
        - tree-sitter-cli
        - unzip
        - vim
        - vivid
        - wget
        - yp-tools
        - yq
        - zoxide
        - zsh
        - zsh-autosuggestions
        - zsh-patina
    - shell:
        - [scripts/install-server-zsh.sh, "Install shared zsh setup for all users"]
