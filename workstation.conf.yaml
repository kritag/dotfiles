# Run after graphical.conf.yaml (see there).
- plugins:
    - plugins/sudo.py
- defaults:
    link:
      relink: true
      create: true
      backup: true
      force: true
- link:
    ~/.config/k9s/config.yaml: config/k9s/config.yaml
    ~/.functions_k8s: zsh/functions_k8s.zsh
    ~/.config/hypr/autostart.lua: config/hypr-workstation/autostart.lua
    ~/.config/dms/settings.json: config/dms/settings-workstation.json
    ~/.config/openlogi/config.toml: config/openlogi/config.toml
    ~/.local/bin/webapp-edge: scripts/webapp-edge.sh
    ~/.local/share/applications/microsoft-edge.desktop: applications/microsoft-edge.desktop
    ~/.config/systemd/user/unlock-keyring.service: services/unlock-keyring.service
    ~/.local/share/dbus-1/services/org.freedesktop.secrets.service: services/org.freedesktop.secrets.service
    ~/.face: logos/Fedora-linux-logo.png
    ~/.config/mimeapps.list: config/mimeapps-workstation.list
- shell:
    - [systemctl --user enable unlock-keyring.service]
    - [scripts/bootstrap-workstation-webapps.sh, "Create webapp launchers"]
    - [scripts/bootstrap-dms-plugins.sh calculator dankActions dankGifSearch, "Install DMS plugins"]
    - ["[ -e ~/.config/kitty/current-theme.conf ] || DOTFILES_BOOTSTRAP=1 dbus-run-session -- scripts/themeSwitch.sh everforest", "Apply the first theme"]
    - ["systemctl is-enabled greetd >/dev/null 2>&1 || DMS_PRIVESC=sudo dms-greeter enable -y", "Enable the DMS greeter (greetd)"]
    - ["DMS_PRIVESC=sudo dms-greeter sync -y", "Sync the DMS theme and settings to the greeter"]
- sudo:
    - link:
        /usr/share/zsh/site-functions/:
          create: true
          glob: true
          force: true
          path: zsh/completions/*
    - shell:
        - [scripts/apply-nsswitch.sh, "Apply nsswitch hosts line from dotfiles"]
        - [install -d -m 0755 /etc/systemd/logind.conf.d && install -m 0644 services/10-lid.conf /etc/systemd/logind.conf.d/10-lid.conf, "Configure systemd-logind lid behavior (ignore lid on external power)"]
        - [systemctl enable --now systemd-resolved.service]
