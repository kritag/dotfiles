- clean:
    - "~"
    - "~/.config"

- link:
    ~/.config/flavours/:
      create: true
      glob: true
      path: config/flavours/*
    ~/.config/tinted-theming/tinty/:
      create: true
      glob: true
      path: config/tinty/*
